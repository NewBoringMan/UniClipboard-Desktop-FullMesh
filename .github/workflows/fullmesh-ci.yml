name: FullMesh CI and package matrix

on:
  pull_request:
  push:
    branches: [main, fullmesh-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullmesh-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ENGINE_VERSION: 1.1.0-rc.6-fullmesh.1

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: integration/scripts/verify-locks.sh
      - run: cargo fmt --check
        working-directory: engine
      - run: node scripts/architecture/check-engine-repository.mjs
        working-directory: engine
      - run: cargo test --workspace --locked
        working-directory: engine
      - run: npm test
        working-directory: relay
      - run: node integration/tests/relay-multiprocess.mjs
      - run: packaging/secret-scan.sh

  desktop:
    needs: verify-source
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
          - runner: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve the verified Engine from this source checkout
        run: node integration/scripts/use-vendored-engine.mjs desktop/Cargo.toml engine
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev xvfb dbus-x11 rpm xdg-utils
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run lint
        working-directory: desktop
      - run: bun run test --run
        working-directory: desktop
      - name: Build and stage the daemon sidecar
        working-directory: desktop
        shell: bash
        run: node scripts/prepare-daemon-sidecar.mjs ${{ matrix.args }}
      - name: Build native installers
        working-directory: desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # WiX/MSI rejects non-numeric SemVer prerelease identifiers. Keep
            # the public alpha label in the release filenames and encode
            # alpha.1 as the equivalent numeric prerelease internally.
            bun run tauri build ${{ matrix.args }} --bundles nsis,msi --config '{"version":"0.1.0-1","bundle":{"createUpdaterArtifacts":false}}'
          else
            bun run tauri build ${{ matrix.args }} --config '{"version":"0.1.0-alpha.1","bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Label Linux packages as unsigned testing artifacts
        if: runner.os == 'Linux'
        shell: bash
        working-directory: desktop
        run: |
          architecture="${{ matrix.target }}"
          architecture="${architecture%%-*}"
          while IFS= read -r package; do
            extension="${package##*.}"
            destination="$(dirname "$package")/UniClipboard-FullMesh-0.1.0-alpha.1-linux-${architecture}-unsigned-testing.${extension}"
            mv "$package" "$destination"
          done < <(find target -path '*/release/bundle/*/*' -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \))
      - name: Label Windows installers as unsigned testing artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $releaseDir = if ('${{ matrix.args }}') { 'target/${{ matrix.target }}/release' } else { 'target/release' }
          $architecture = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'arm64' } else { 'x64' }
          Get-ChildItem (Join-Path $releaseDir 'bundle') -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') } |
            ForEach-Object {
              $destination = Join-Path $_.DirectoryName "UniClipboard-FullMesh-0.1.0-alpha.1-windows-$architecture-unsigned-testing$($_.Extension.ToLowerInvariant())"
              Move-Item $_.FullName $destination -Force
            }
      - name: Test Linux deb install, launch and clean uninstall
        if: runner.os == 'Linux'
        shell: bash
        working-directory: desktop
        run: |
          deb="$(find target -path '*/release/bundle/deb/*.deb' -type f -print -quit)"
          test -n "$deb"
          package="$(dpkg-deb -f "$deb" Package)"
          sudo dpkg -i "$deb" || sudo apt-get install -f -y
          binary="$(dpkg -L "$package" | awk '/\/usr\/bin\// { print; exit }')"
          test -x "$binary"
          dbus-run-session -- xvfb-run -a "$binary" >"$RUNNER_TEMP/uniclipboard-linux.log" 2>&1 &
          pid=$!
          sleep 8
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
          pkill -TERM -x uniclipboard || true
          pkill -TERM -x uniclipd || true
          for attempt in $(seq 1 20); do
            if ! pgrep -x uniclipboard >/dev/null && ! pgrep -x uniclipd >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo 'UniClipboard processes did not stop before package removal' >&2
              exit 1
            fi
            sleep 1
          done
          sudo dpkg -r "$package"
          sudo dpkg --purge "$package" || true
          test ! -e "$binary"
      - name: Verify and launch the macOS testing app
        if: runner.os == 'macOS'
        shell: bash
        working-directory: desktop
        run: |
          app="$(find target -path '*/release/bundle/macos/*.app' -type d -print -quit)"
          dmg="$(find target -path '*/release/bundle/dmg/*.dmg' -type f -print -quit)"
          test -n "$app" && test -n "$dmg"
          architecture="${{ matrix.target }}"
          architecture="${architecture%%-*}"
          labeled_dmg="$(dirname "$dmg")/UniClipboard-FullMesh-0.1.0-alpha.1-macos-${architecture}-ad-hoc-testing.dmg"
          app_zip="$(dirname "$app")/UniClipboard-FullMesh-0.1.0-alpha.1-macos-${architecture}-ad-hoc-testing.app.zip"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          rm -f "$dmg"
          hdiutil create -volname 'UniClipboard Testing' -srcfolder "$app" -ov -format UDZO "$labeled_dmg"
          hdiutil verify "$labeled_dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$app_zip"
          binary="$(find "$app/Contents/MacOS" -type f -perm -111 -print -quit)"
          "$binary" >"$RUNNER_TEMP/uniclipboard-macos.log" 2>&1 &
          pid=$!
          sleep 8
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $releaseDir = if ('${{ matrix.args }}') { 'target/${{ matrix.target }}/release' } else { 'target/release' }
          $architecture = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'arm64' } else { 'x64' }
          $gui = @('UniClipboard.exe', 'uniclipboard.exe') | ForEach-Object { Join-Path $releaseDir $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          $daemon = Join-Path $releaseDir 'uniclipd.exe'
          if (-not $gui -or -not (Test-Path $daemon)) { throw 'portable package requires GUI and daemon executables' }
          $stage = Join-Path $env:RUNNER_TEMP "uniclipboard-portable-$architecture"
          $output = Join-Path $releaseDir 'bundle/portable'
          New-Item -ItemType Directory -Path $stage,$output -Force | Out-Null
          Copy-Item $gui (Join-Path $stage 'UniClipboard.exe')
          Copy-Item $daemon (Join-Path $stage 'uniclipd.exe')
          New-Item -ItemType File -Path (Join-Path $stage 'portable.dat') -Force | Out-Null
          Copy-Item 'packaging/windows/portable/README.txt' (Join-Path $stage 'README.txt')
          Compress-Archive -Path "$stage/*" -DestinationPath (Join-Path $output "UniClipboard-FullMesh-0.1.0-alpha.1-windows-${architecture}-unsigned-testing-portable.zip") -Force
      - name: Package Windows test-signed MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $releaseDir = if ('${{ matrix.args }}') { 'target/${{ matrix.target }}/release' } else { 'target/release' }
          $architecture = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'arm64' } else { 'x64' }
          ./packaging/windows/msix/package-msix.ps1 -ReleaseDir $releaseDir -Version '0.1.0-alpha.1' -Architecture $architecture -OutputDir "$releaseDir/bundle/msix"
      - name: Test x64 MSIX install, launch and uninstall
        if: runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        working-directory: desktop
        run: |
          ./packaging/windows/msix/test-msix-lifecycle.ps1 `
            -PackagePath 'target/release/bundle/msix/UniClipboard_0.1.0-alpha.1_x64-test-signed.msix' `
            -CertificatePath 'target/release/bundle/msix/UniClipboard_0.1.0-alpha.1_x64-testing.cer'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/target/**/release/bundle/**/*
            desktop/target/release/bundle/**/*
          if-no-files-found: error

  android:
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: mobile/.nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android
      - name: Install Android NDK and Rust bridge
        run: |
          sdkmanager 'ndk;27.1.12297006' 'platforms;android-36' 'build-tools;36.0.0'
          cargo install cargo-ndk --locked --version 4.1.2
      - name: Build exact pinned Engine AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          UC_ENGINE_UNIFFI_BUILD_LOCKED: '1'
          CARGO_BUILD_PIPELINING: 'false'
        run: engine/bindings/uc-engine-uniffi/scripts/build-android-aar.sh
      - run: npm ci
        working-directory: mobile
      - name: Run mobile static checks and unit/UI component tests
        working-directory: mobile
        run: |
          npm run check:quality
          npm test -- --runInBand
      - run: npx expo prebuild -p android --clean --no-install
        working-directory: mobile
        env:
          APP_VARIANT: production
      - name: Build all Android packages from the exact AAR
        working-directory: mobile
        env:
          APP_VARIANT: production
          UC_ENGINE_LOCAL_AAR: ${{ github.workspace }}/engine/target/uc-engine-uniffi-dist/android/UniClipboardEngine.aar
        run: bash scripts/build-android-release.sh
      - name: Verify signatures, package identity and exact ABIs
        working-directory: mobile
        env:
          UC_ENGINE_EXPECTED_AAR: ${{ github.workspace }}/engine/target/uc-engine-uniffi-dist/android/UniClipboardEngine.aar
        run: bash scripts/verify-android-release.sh
      - name: Package explicitly test-signed Android artifacts
        working-directory: mobile
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk release/UniClipboard-FullMesh-0.1.0-alpha.1-android-arm64-v8a-test-signed.apk
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk release/UniClipboard-FullMesh-0.1.0-alpha.1-android-armeabi-v7a-test-signed.apk
          cp android/app/build/outputs/apk/release/app-x86_64-release.apk release/UniClipboard-FullMesh-0.1.0-alpha.1-android-x86_64-test-signed.apk
          cp android/app/build/outputs/apk/release/app-universal-release.apk release/UniClipboard-FullMesh-0.1.0-alpha.1-android-universal-test-signed.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/UniClipboard-FullMesh-0.1.0-alpha.1-android-universal-test-signed.aab
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35 repeatedly loses the ADB service during the runner's
          # post-boot unlock when GitHub's hosted runner has no KVM. API 30
          # still exceeds the app's minSdk and is stable under x86_64 software
          # emulation, while the release package itself is independently
          # checked above for targetSdk 36.
          api-level: 30
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          script: |
            adb install -r mobile/android/app/build/outputs/apk/release/app-x86_64-release.apk
            adb shell monkey -p app.uniclipboard.android 1
            for attempt in $(seq 1 30); do pid="$(adb shell pidof app.uniclipboard.android | tr -d '\r')"; if [ -n "$pid" ]; then echo "UniClipboard Android process: $pid"; break; fi; if [ "$attempt" -eq 30 ]; then adb shell dumpsys activity activities; exit 1; fi; sleep 1; done
            adb uninstall app.uniclipboard.android
      - uses: actions/upload-artifact@v7
        with:
          name: android-installers
          path: |
            mobile/release/*
            engine/target/uc-engine-uniffi-dist/android/*
          if-no-files-found: error

  ios-simulator:
    needs: verify-source
    runs-on: macos-26
    timeout-minutes: 180
    env:
      # The Podspec and its Xcode verification phase must agree that the
      # XCFramework came from this exact pinned source checkout.
      UC_ENGINE_LOCAL_CORE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: mobile/.nvmrc
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: npm ci
        working-directory: mobile
      - name: Build and adopt exact Engine XCFramework
        run: mobile/scripts/prepare-local-unified-engine-core.sh engine
      - run: npx expo prebuild -p ios --clean --no-install
        working-directory: mobile
        env:
          APP_VARIANT: production
      - run: pod install
        working-directory: mobile/ios
      - name: Build app, share extension and keyboard for Simulator
        run: |
          xcodebuild build \
            -workspace mobile/ios/UniClip.xcworkspace \
            -scheme UniClip \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath mobile/ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Install, launch and uninstall on iOS Simulator
        shell: bash
        run: |
          device="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(item["udid"] for group in devices.values() for item in group if "iPhone" in item["name"]))
          ')"
          app='mobile/ios/build/Build/Products/Release-iphonesimulator/UniClip.app'
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" app.uniclipboard.UniClipboard
          xcrun simctl terminate "$device" app.uniclipboard.UniClipboard
          xcrun simctl uninstall "$device" app.uniclipboard.UniClipboard
      - name: Build unsigned device archive
        run: |
          xcodebuild archive \
            -workspace mobile/ios/UniClip.xcworkspace \
            -scheme UniClip \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath mobile/ios/build/UniClip-0.1.0-alpha.1-ios-device-unsigned-testing.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package Simulator app, unsigned device archive and Engine XCFramework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/ios/build/Build/Products/Release-iphonesimulator/UniClip.app \
            mobile/ios/UniClip-0.1.0-alpha.1-ios-simulator-unsigned-testing.zip
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/ios/build/UniClip-0.1.0-alpha.1-ios-device-unsigned-testing.xcarchive \
            mobile/ios/UniClip-0.1.0-alpha.1-ios-device-unsigned-testing.xcarchive.zip
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/modules/uc-engine/ios/UniClipboardEngine.xcframework \
            mobile/ios/UniClipboardEngine-1.1.0-rc.6-fullmesh.1-xcframework.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-build
          path: |
            mobile/ios/UniClip-0.1.0-alpha.1-ios-simulator-unsigned-testing.zip
            mobile/ios/UniClip-0.1.0-alpha.1-ios-device-unsigned-testing.xcarchive.zip
            mobile/ios/UniClipboardEngine-1.1.0-rc.6-fullmesh.1-xcframework.zip
            mobile/modules/uc-engine/ios/Bindings/uc_engine_uniffi.swift
          if-no-files-found: error

  relay-oci:
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 and arm64 mailbox OCI image
        uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: false
          tags: uniclipboard/fullmesh-relay:${{ github.sha }}
          outputs: type=oci,dest=/tmp/UniClipboard-FullMesh-0.1.0-alpha.1-relay-amd64-arm64-unsigned-testing.oci.tar
      - uses: actions/upload-artifact@v7
        with:
          name: relay-oci
          path: /tmp/UniClipboard-FullMesh-0.1.0-alpha.1-relay-amd64-arm64-unsigned-testing.oci.tar
          if-no-files-found: error

  assemble-release:
    if: >-
      ${{ success() &&
          (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') ||
           github.ref == 'refs/heads/fullmesh-ci' || startsWith(github.head_ref, 'fullmesh-ci')) }}
    needs: [desktop, android, ios-simulator, relay-oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Prime locked Cargo sources for offline SBOM metadata
        run: cargo fetch --manifest-path engine/Cargo.toml --locked
      - uses: actions/download-artifact@v8
        with:
          path: .release-artifacts
          pattern: "!*.dockerbuild"
      - name: Restore full component histories for the source bundle
        shell: bash
        run: |
          root="$(git rev-parse --show-toplevel)"
          component_root="$(git -C engine rev-parse --show-toplevel)"
          if [[ "$component_root" != "$root" ]]; then
            git submodule foreach --recursive '
              git fetch --tags --prune
              if test -f "$(git rev-parse --git-path shallow)"; then git fetch --unshallow; fi
            '
          else
            echo 'Vendored CI source tree detected; canonical histories are preserved in the release source archive.'
          fi
      - name: Stage platform artifacts
        run: node packaging/stage-ci-artifacts.mjs .release-artifacts 0.1.0-alpha.1
      - name: Record the intentionally source-only HarmonyOS status
        run: |
          cp docs/audit/GAP_MATRIX.md dist/0.1.0-alpha.1/harmonyos/HARMONYOS_STATUS.md
      - name: Build complete source archive
        run: packaging/build-source-bundle.sh 0.1.0-alpha.1
      - name: Generate locked-source SPDX and license list
        run: node packaging/generate-source-sbom.mjs 0.1.0-alpha.1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/0.1.0-alpha.1/sbom/UniClipboard-FullMesh-0.1.0-alpha.1.spdx.json
      - name: Record CI test provenance
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p dist/0.1.0-alpha.1/test-reports
          node -e '
            const fs = require("fs");
            const report = {
              schemaVersion: 1,
              runUrl: process.env.RUN_URL,
              commit: process.env.GITHUB_SHA,
              result: "passed",
              gates: ["verify-source", "desktop", "android", "ios-simulator", "relay-oci"]
            };
            fs.writeFileSync("dist/0.1.0-alpha.1/test-reports/ci-summary.json", JSON.stringify(report, null, 2) + "\\n");
          '
      - run: node packaging/assemble-release.mjs --version 0.1.0-alpha.1
      - run: node packaging/verify-release.mjs 0.1.0-alpha.1
      - name: Archive the complete delivery directory
        run: tar -C dist -czf UniClipboard-FullMesh-0.1.0-alpha.1-delivery.tar.gz 0.1.0-alpha.1
      - uses: actions/upload-artifact@v7
        with:
          name: fullmesh-delivery-0.1.0-alpha.1
          path: |
            dist/0.1.0-alpha.1/**
            UniClipboard-FullMesh-0.1.0-alpha.1-delivery.tar.gz
          if-no-files-found: error
      - name: Publish immutable GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease \
            --verify-tag \
            --title "UniClipboard FullMesh ${GITHUB_REF_NAME}" \
            --notes "Test/ad-hoc signed integration candidate. See manifest.json and SIGNING_REQUIREMENTS.md." \
            UniClipboard-FullMesh-0.1.0-alpha.1-delivery.tar.gz \
            dist/0.1.0-alpha.1/checksums/SHA256SUMS \
            dist/0.1.0-alpha.1/manifest.json

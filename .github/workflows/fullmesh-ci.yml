name: Retire superseded FullMesh CI

on:
  pull_request:
  push:
    branches: [fullmesh-ci]

permissions:
  contents: read

concurrency:
  group: fullmesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Superseded CI-only matrix retired; use PR #6.'

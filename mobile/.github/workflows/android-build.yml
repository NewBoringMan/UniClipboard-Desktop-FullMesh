name: android-build

on:
  workflow_call:
    outputs:
      version:
        description: 'App version from package.json'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build Release APKs and AAB
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      POSTHOG_PROJECT_KEY: ${{ secrets.UC_POSTHOG_PROJECT_KEY }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Prepare unified engine core
        run: npm run core:prepare

      - name: Verify unified engine core
        run: npm run core:verify

      - name: Expo prebuild
        run: npx expo prebuild -p android --no-install

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APKs and AAB
        run: bash scripts/build-android-release.sh

      - name: Verify Android packages, signing and ABIs
        run: bash scripts/verify-android-release.sh

      - name: Get version name
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Name release artifacts
        run: |
          cd android/app/build/outputs/apk/release
          VERSION=${{ steps.version.outputs.version }}
          for ABI in armeabi-v7a arm64-v8a x86_64 universal; do
            mv "app-${ABI}-release.apk" "UniClip-${VERSION}-${ABI}.apk"
          done
          cd ../../bundle/release
          mv app-release.aab "UniClip-${VERSION}-universal.aab"

      - name: Upload Android installers
        uses: actions/upload-artifact@v7
        with:
          name: android-installers
          path: |
            android/app/build/outputs/apk/release/UniClip-${{ steps.version.outputs.version }}-*.apk
            android/app/build/outputs/bundle/release/UniClip-${{ steps.version.outputs.version }}-universal.aab
          if-no-files-found: error
